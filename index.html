<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sovak Fitness</title>
<meta name="description" content="Mike's cut, lifts and body composition, month by month.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitness">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  color-scheme:light;
  --page:#f6f4ef; --surface:#fcfcfb; --raised:#ffffff;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e8e6df; --axis:#c3c2b7; --ring:rgba(11,11,11,.08);
  --s1:#2a78d6; --s1-wash:rgba(42,120,214,.10);
  --s2:#eb6834; --s3:#1baf7a;
  --div-neg:#2a78d6; --div-mid:#ecebe6; --div-pos:#e34948;
  --good:#006300; --bad:#c23434;
  --accent-grad:linear-gradient(135deg,#2a78d6 0%,#1baf7a 100%);
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#0f0f0e; --surface:#181817; --raised:#1f1f1d;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8f8d86;
    --grid:#2a2a28; --axis:#3d3d3a; --ring:rgba(255,255,255,.08);
    --s1:#3987e5; --s1-wash:rgba(57,135,229,.14);
    --s2:#d95926; --s3:#199e70;
    --div-neg:#3987e5; --div-mid:#2f2f2c; --div-pos:#e66767;
    --good:#0ca30c; --bad:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0f0f0e; --surface:#181817; --raised:#1f1f1d;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8f8d86;
  --grid:#2a2a28; --axis:#3d3d3a; --ring:rgba(255,255,255,.08);
  --s1:#3987e5; --s1-wash:rgba(57,135,229,.14);
  --s2:#d95926; --s3:#199e70;
  --div-neg:#3987e5; --div-mid:#2f2f2c; --div-pos:#e66767;
  --good:#0ca30c; --bad:#e66767;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--page); color:var(--ink);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
main{max-width:720px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 18px}
header h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0;font-weight:650}
header .asof{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border-radius:20px;padding:18px 16px;margin:0 0 14px;box-shadow:0 0 0 1px var(--ring)}
.card h2{font-size:15px;margin:0 0 2px;font-weight:650;letter-spacing:-.01em}
.card .sub{font-size:13px;color:var(--ink-2);margin:0 0 12px}
/* hero */
.hero{position:relative;overflow:hidden;padding:22px 18px 16px}
.hero::before{content:"";position:absolute;inset:-40% -30% auto auto;width:260px;height:260px;border-radius:50%;background:var(--accent-grad);opacity:.13;filter:blur(30px)}
.hero .label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero .big{font-size:64px;line-height:1;font-weight:750;letter-spacing:-.04em;margin:6px 0 4px}
.hero .big small{font-size:20px;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-left:4px}
.hero .delta{font-size:14px;color:var(--ink-2)}
.hero .delta b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.tile{background:var(--raised);border-radius:14px;padding:12px;box-shadow:0 0 0 1px var(--ring)}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}
.tile .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.tile .v small{font-size:13px;color:var(--ink-2);font-weight:550;margin-left:2px}
.tile .n{font-size:12px;color:var(--ink-2);margin-top:2px}
/* phase */
.phase-bar{position:relative;height:34px;margin:6px 0 4px;border-radius:10px;overflow:hidden;display:flex;gap:2px}
.phase-bar .seg{height:100%;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:650;white-space:nowrap;overflow:hidden;color:#fff}
.phase-today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.phase-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
/* charts */
.chart{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin:2px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend i.line{width:14px;height:2px;border-radius:2px;vertical-align:3px}
.tip{position:absolute;pointer-events:none;background:var(--raised);color:var(--ink);font-size:12px;line-height:1.35;padding:8px 10px;border-radius:10px;box-shadow:0 0 0 1px var(--ring),0 6px 18px rgba(0,0,0,.18);opacity:0;transition:opacity .12s;z-index:5;min-width:120px;white-space:nowrap}
.tip b{font-weight:650}
.tip .m{color:var(--muted)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cal .cell{aspect-ratio:1/1.05;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;line-height:1.1;position:relative;cursor:pointer}
.cal .cell .d{font-size:9.5px;opacity:.7}
.cal .cell .c{font-weight:650;font-variant-numeric:tabular-nums}
.cal .cell.empty{background:transparent;box-shadow:inset 0 0 0 1px var(--grid)}
.cal .cell.social::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--s2);box-shadow:0 0 0 1.5px var(--surface)}
.scale{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-top:10px}
.scale .ramp{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--div-neg),var(--div-mid),var(--div-pos))}
/* lifts */
.lifts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lift{background:var(--raised);border-radius:14px;padding:12px 12px 8px;box-shadow:0 0 0 1px var(--ring)}
.lift .name{font-size:12px;font-weight:650;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lift .now{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.lift .now small{font-size:12px;color:var(--muted);font-weight:550}
.lift .chg{font-size:12px;font-weight:650}
.lift svg{display:block;width:100%;height:36px;margin-top:6px}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
/* months */
.months a{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--grid);color:var(--ink);text-decoration:none;font-weight:600}
.months a:first-of-type{border-top:0}
.months a span{font-weight:500;color:var(--muted);font-size:13px}
details.table{margin-top:10px;font-size:12px}
details.table summary{color:var(--ink-2);cursor:pointer;font-weight:600}
details.table .wrap{overflow-x:auto;margin-top:8px}
details.table table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
details.table th,details.table td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
details.table th:first-child,details.table td:first-child{text-align:left}
footer{font-size:12px;color:var(--muted);text-align:center;margin:20px 0 4px}
footer a{color:var(--ink-2)}
.err{padding:24px;text-align:center;color:var(--ink-2)}
@media (min-width:640px){
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .lifts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hero .big{font-size:76px}
}

/* ===== app shell ===== */
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
body[data-tab="trends"]{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header .hright{display:flex;align-items:center;gap:10px}
.iconbtn{appearance:none;border:0;background:transparent;color:var(--ink-2);width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn:active{background:var(--grid)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;padding:6px 12px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--page) 82%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);box-shadow:0 -1px 0 var(--ring)}
.tabbar button{flex:1;max-width:160px;appearance:none;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font:600 11px/1 system-ui,-apple-system,sans-serif;border-radius:12px;cursor:pointer}
.tabbar button.on{color:var(--s1)}
.savebar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:19;display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px max(16px,env(safe-area-inset-left));max-width:720px;margin:0 auto}
.savebar::before{content:"";position:absolute;inset:0 8px;border-radius:18px;background:var(--raised);box-shadow:0 0 0 1px var(--ring),0 8px 24px rgba(0,0,0,.12);z-index:-1}
.savebar .sb-msg{font-size:13px;color:var(--ink-2);padding-left:10px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.savebar .sb-msg.warn{color:var(--s2);font-weight:600}
.savebar .btn{margin-right:8px}
.toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:40;background:var(--ink);color:var(--page);font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:999px;transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:#fff}

/* ===== controls ===== */
.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;font:650 15px/1 system-ui,-apple-system,sans-serif;border-radius:12px;padding:12px 16px;color:var(--ink);background:var(--grid);min-height:44px;text-decoration:none}
.btn.primary{background:var(--s1);color:#fff}
.btn.primary:disabled{background:var(--grid);color:var(--muted)}
.btn.soft{background:var(--raised);box-shadow:0 0 0 1px var(--ring)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--axis)}
.btn.small{min-height:36px;padding:8px 12px;font-size:14px}
.btn.danger,.link.danger{color:var(--bad)}
.link{appearance:none;border:0;background:none;color:var(--s1);font:600 14px/1.3 system-ui,-apple-system,sans-serif;padding:6px 2px;cursor:pointer}
.pill{appearance:none;border:0;background:var(--grid);color:var(--ink-2);font:650 12px/1 system-ui,-apple-system,sans-serif;border-radius:999px;padding:7px 12px;cursor:pointer}
.row{display:flex;align-items:center}.row.gap{gap:10px}.row.wrap{flex-wrap:wrap}.row.between{justify-content:space-between}
.grow{flex:1}
.center{text-align:center;margin:6px 0 10px}
.tag{font-size:11.5px;font-weight:650;color:var(--ink-2);background:var(--grid);border-radius:999px;padding:4px 9px}
.fine{font-size:12px;color:var(--muted);margin:10px 0 0}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:color-mix(in srgb,var(--s2) 14%,var(--surface));border-radius:14px;padding:10px 14px;margin:0 0 12px;font-size:13.5px}
.banner.calm{background:color-mix(in srgb,var(--s1) 12%,var(--surface))}

/* fields */
.form h2{margin-bottom:12px}
.field{display:block;min-width:0}
.field>span{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2);margin:0 0 6px}
.inwrap{display:flex;align-items:center;background:var(--raised);border-radius:12px;box-shadow:inset 0 0 0 1px var(--axis);padding:0 12px;min-height:50px}
.inwrap:focus-within{box-shadow:inset 0 0 0 2px var(--s1)}
.inwrap input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:650 19px/1.2 system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;padding:12px 0}
.inwrap input::placeholder,textarea::placeholder{color:var(--muted);font-weight:500;opacity:.75}
.inwrap em{font-style:normal;font-size:13px;color:var(--muted);font-weight:600;margin-left:6px}
.field.compact .inwrap{min-height:44px}
.field.compact .inwrap input{font-size:17px;padding:9px 0}
textarea{width:100%;border:0;outline:0;border-radius:12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--axis);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif;padding:12px;resize:vertical}
textarea:focus{box-shadow:inset 0 0 0 2px var(--s1)}
.fields2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.hint{display:block;font-size:12px;color:var(--muted);margin-top:6px;min-height:15px}
.minibar{height:6px;border-radius:3px;background:var(--grid);margin-top:10px;overflow:hidden}
.minibar i{display:block;height:100%;width:0;background:var(--axis);border-radius:3px;transition:width .3s}
.minibar i.hit{background:var(--s3)}

/* date nav */
.datenav{margin:0 0 14px}
.dn-top{display:flex;align-items:center;justify-content:space-between}
.dn-title{position:relative;text-align:center;cursor:pointer}
.dn-rel{display:block;font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.dn-date{display:block;font-size:13px;color:var(--muted);font-weight:600}
.dn-title input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.wk{appearance:none;border:0;background:var(--surface);box-shadow:0 0 0 1px var(--ring);border-radius:14px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);cursor:pointer}
.wk .wl{font-size:10.5px;font-weight:650;color:var(--muted)}
.wk .wn{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.wk .dots{display:flex;gap:3px;height:6px}
.wk .dots i{width:6px;height:6px;border-radius:50%}
.wk .df{background:var(--s1)}.wk .dl{background:var(--s3)}.wk .ds{background:var(--s2)}.wk .dd{background:var(--muted)}
.wk.today{box-shadow:inset 0 0 0 2px var(--s1)}
.wk.future .wn{color:var(--ink-2)}
.wk.sel{background:var(--ink);box-shadow:none}
.wk.sel .wl,.wk.sel .wn{color:var(--page)}
.today-pill{display:block;margin:10px auto 0}

/* food meter */
.meter{background:var(--raised);border-radius:14px;padding:12px 14px;box-shadow:0 0 0 1px var(--ring);margin-bottom:12px}
.m-row{display:flex;align-items:baseline;gap:8px}
.m-big{font-size:32px;font-weight:750;letter-spacing:-.03em}
.m-of{color:var(--muted);font-size:13px;font-weight:600}
.m-delta{margin-left:auto;font-weight:700;font-size:14px}
.m-delta.ok{color:var(--good)}.m-delta.under{color:var(--s1)}.m-delta.over{color:var(--bad)}
.m-row.small{font-size:13px;color:var(--ink-2);font-weight:600;margin-top:10px}
.m-row.small .num{color:var(--ink);font-weight:700}
.bar{position:relative;height:10px;border-radius:5px;background:var(--grid);margin-top:8px;overflow:visible}
.bar.thin{height:6px;border-radius:3px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:inherit;background:var(--s1);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.bar i.over{background:var(--bad)}
.bar i.pro{background:var(--axis)}.bar i.pro.hit{background:var(--s3)}
.bar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 4px}
.tools .btn{width:100%}
.tools.one{grid-template-columns:1fr}
.paste{margin-top:10px;display:grid;gap:8px}
.paste[hidden]{display:none}
.parsed{margin-top:10px;font-size:13.5px;padding:10px 12px;border-radius:12px;background:var(--grid)}
.parsed.warn{background:color-mix(in srgb,var(--s2) 16%,var(--surface))}
.parsed.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs:empty{display:none}
.thumb{position:relative;width:72px;height:96px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--ring)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.pending{outline:2px dashed var(--s2);outline-offset:2px}
.thumb button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center}
details.items{margin-top:12px}
details.items summary{font-size:13px;font-weight:650;color:var(--ink-2);cursor:pointer}
details.items ul{list-style:none;margin:8px 0 0;padding:0}
details.items li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--grid);font-size:14px}
details.items li small{display:block;color:var(--muted);font-size:12px}

/* day */
.seg{display:flex;gap:4px;background:var(--grid);padding:4px;border-radius:14px;margin-bottom:12px}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--ink-2);font:650 13px/1.15 system-ui,-apple-system,sans-serif;padding:10px 4px;border-radius:10px;cursor:pointer;min-height:42px}
.seg button.on{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on.soc{background:var(--s2);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{appearance:none;border:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--axis);color:var(--ink-2);font:600 14px/1 system-ui,-apple-system,sans-serif;border-radius:999px;padding:10px 14px;cursor:pointer}
.chip.on{background:var(--s3);color:#fff;box-shadow:none}
.liftrow{width:100%;appearance:none;border:0;cursor:pointer;margin-top:14px;display:flex;align-items:center;gap:12px;text-align:left;background:var(--raised);box-shadow:0 0 0 1px var(--ring);border-radius:14px;padding:12px 12px;color:var(--ink)}
.lr-ico{width:40px;height:40px;border-radius:11px;background:color-mix(in srgb,var(--s3) 16%,transparent);color:var(--s3);display:flex;align-items:center;justify-content:center}
.lr-t{flex:1;display:flex;flex-direction:column}
.lr-t b{font-size:15px}.lr-t small{font-size:12.5px;color:var(--muted)}
.lr-go{color:var(--muted)}
details.monthly summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;justify-content:space-between}
details.monthly summary::-webkit-details-marker{display:none}
details.monthly summary h2{margin:0}
details.monthly summary small{color:var(--muted);font-size:12px}
details.monthly[open] summary{margin-bottom:12px}

/* lift */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 12px}
.stats3 div{background:var(--raised);border-radius:12px;padding:10px;box-shadow:0 0 0 1px var(--ring)}
.stats3 b{display:block;font-size:20px;font-weight:750;letter-spacing:-.02em}
.stats3 small{font-size:11.5px;color:var(--muted);font-weight:600}
.exlist{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:14px}
.ex{background:var(--surface);border-radius:18px;padding:14px;box-shadow:0 0 0 1px var(--ring);transition:box-shadow .2s}
.ex header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ex-t b{font-size:16px;font-weight:700}
.ex-t small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.ss{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:750;color:var(--s1);background:color-mix(in srgb,var(--s1) 14%,transparent);border-radius:6px;padding:2px 6px;vertical-align:2px}
.ex-check{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:transparent;box-shadow:inset 0 0 0 2px var(--axis)}
.ex.started .ex-check{box-shadow:inset 0 0 0 2px var(--s3)}
.ex.done{box-shadow:0 0 0 2px var(--s3)}
.ex.done .ex-check{background:var(--s3);color:#fff;box-shadow:none}
.target{font-size:13px;color:var(--ink-2);margin:8px 0 0}
.target.up{color:var(--good)}
.target b{color:var(--ink)}
.exnote{font-size:12.5px;color:var(--muted);margin-top:4px}
.ex-row{display:flex;gap:10px;align-items:center;margin-top:10px}
.wt{display:flex;align-items:center;background:var(--raised);border-radius:12px;box-shadow:inset 0 0 0 1px var(--axis);padding:0 10px;height:48px;width:92px;flex:none}
.wt.sm{width:80px;height:42px}
.wt:focus-within{box-shadow:inset 0 0 0 2px var(--s1)}
.wt input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font:700 18px/1 system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
.wt input::placeholder{color:var(--muted);opacity:.6;font-weight:600}
.wt em{font-style:normal;font-size:12px;color:var(--muted);font-weight:600}
.sets{flex:1;display:flex;gap:6px;min-width:0;overflow-x:auto;padding:2px}
.sets input{width:44px;flex:none;height:48px;border:0;outline:0;border-radius:12px;text-align:center;background:var(--raised);box-shadow:inset 0 0 0 1px var(--axis);color:var(--ink);font:700 18px/1 system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums}
.sets input:focus{box-shadow:inset 0 0 0 2px var(--s1)}
.sets input:not(:placeholder-shown){background:color-mix(in srgb,var(--s3) 14%,var(--raised));box-shadow:inset 0 0 0 1.5px var(--s3)}
.sets input::placeholder{color:var(--muted);opacity:.55;font-weight:600}
.addset{width:36px;height:48px;flex:none;border:0;border-radius:12px;background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px dashed var(--axis);display:flex;align-items:center;justify-content:center;cursor:pointer}
.drop{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--ink-2);font-weight:600}
.drop .dropr{width:56px;height:42px;border:0;outline:0;border-radius:12px;text-align:center;background:var(--raised);box-shadow:inset 0 0 0 1px var(--axis);color:var(--ink);font:700 17px/1 system-ui,-apple-system,sans-serif}
.addex .inwrap input{font-size:16px;font-weight:550}
.addex .row.between{margin-top:10px}

.btn.wide{width:100%;margin:0 0 10px}
.rlist{display:grid;gap:6px;margin:6px 0 16px}
.rrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--raised);box-shadow:0 0 0 1px var(--ring);cursor:pointer}
.rrow.off{opacity:.55;cursor:default}
.rrow input{width:20px;height:20px;accent-color:var(--s1);flex:none}
.rd{flex:1;min-width:0;display:flex;flex-direction:column}
.rd b{font-size:15px}.rd small{font-size:12.5px;color:var(--ink-2)}
.rs{font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;background:var(--grid);color:var(--ink-2);white-space:nowrap}
.rs.new{background:color-mix(in srgb,var(--s3) 18%,transparent);color:var(--s3)}
.rs.updates{background:color-mix(in srgb,var(--s1) 16%,transparent);color:var(--s1)}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0);display:flex;align-items:flex-end;justify-content:center;transition:background .2s}
.sheet-wrap.open{background:rgba(0,0,0,.45)}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow:auto}
.sheet-wrap.open .sheet{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between}
.sheet-h h2{margin:0;font-size:19px}
.sheet .sub{font-size:14px;color:var(--ink-2)}
.steps{padding-left:20px;font-size:14px;line-height:1.5;color:var(--ink-2)}
.steps a{color:var(--s1);font-weight:650}
.sheet .field{margin:14px 0 8px}
.sheet-msg{font-size:13.5px;min-height:20px;margin:6px 0 12px;color:var(--ink-2)}
.sheet-msg.ok{color:var(--good);font-weight:650}.sheet-msg.bad{color:var(--bad);font-weight:650}
@media (min-width:640px){ .grid3{grid-template-columns:repeat(6,minmax(0,1fr))} }
</style>
